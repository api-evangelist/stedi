note: >
  Stedi's public documentation does NOT yet mention any client SDK — the API reference tells
  developers to generate client code from the OpenAPI specs, and the "Build with AI" page lists
  only the OpenAPI specs, llms.txt and the MCP server as developer tooling. Two first-party
  packages nonetheless exist and are actively published: @stedi/sdk (npm) and stedi (PyPI),
  both at 0.0.9, both released on 2026-08-14, both pointing at github.com/Stedi/sdk (which is
  not publicly readable — the GitHub API returns 404 for that repo). They are treated as
  official because they sit in the @stedi npm scope, are published by the same Stedi
  maintainers as the legacy @stedi packages, and the PyPI author field reads "Stedi". They are
  0.0.x pre-release and undocumented, so an integrator should not assume support.
