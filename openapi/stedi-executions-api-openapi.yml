          description: The maximum number of elements to return in a page. You can set this to a maximum of 500
            elements. If not specified, the default is 100.
          minimum: 1
          type: number
      - description: An opaque token returned by a previous call to this operation in the `nextPageToken`. If not
          specified, Stedi returns the first page of results.
        in: query
        name: pageToken
        schema:
          description: An opaque token returned by a previous call to this operation in the `nextPageToken`. If
            not specified, Stedi returns the first page of results.
          maxLength: 1024
          minLength: 1
          type: string
      - description: The direction of the transaction. Inbound transactions are those you receive from a payer,
          provider, or other trading partner. Outbound transactions are those you send to a payer, provider, or
          other trading partner.
        in: query
        name: direction
        schema:
          $ref: '#/components/schemas/Direction'
      - description: A code specifying the reason for the fault. This code appears in the `code` property of the
          HTTP error response.
        in: query
        name: faultCode
        schema:
          $ref: '#/components/schemas/ExecutionFaultCode'
      - description: The unique identifier for the partnership within the Stedi platform. If you're sending or receiving
          transactions through the Stedi clearinghouse, Stedi configures the necessary partnership for you automatically
          when you set up your account.
        in: query
        name: partnershipId
        schema:
          description: The unique identifier for the partnership within the Stedi platform. If you're sending or
            receiving transactions through the Stedi clearinghouse, Stedi configures the necessary partnership for
            you automatically when you set up your account.
          type: string
      - description: "The status of the execution.\n  - You can only retry executions with a `FAILED` or `IGNORED`\
          \ status.\n  - An execution is `COMPLETED` when Stedi has finished processing the file with no errors.\
          \ If the file is an outbound file, a `COMPLETED` status also means that Stedi successfully delivered it\
          \ to the configured connection."
        in: query
        name: status
        schema:
          $ref: '#/components/schemas/ExecutionStatus'
      - description: The start of the time range to filter file executions. The results will include executions
          created at or after this timestamp.
