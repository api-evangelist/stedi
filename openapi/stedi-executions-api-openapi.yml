paths:
  /executions:
    get:
      description: Fetch a list of executions, sorted by the date they were created from newest to oldest.
      operationId: ListExecutions
      parameters:
      - description: The maximum number of elements to return in a page. You can set this to a maximum of 500 elements.
          If not specified, the default is 100.
        examples:
          ListExecutions_example1:
