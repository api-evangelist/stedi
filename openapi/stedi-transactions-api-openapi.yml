paths:
  /transactions:
    get:
      description: Fetch a list of transactions, sorted by the date they were created from newest to oldest.
      operationId: ListTransactions
      parameters:
      - description: The maximum number of elements to return in a page. You can set this to a maximum of 500 elements.
          If not specified, the default is 100.
        examples:
          ListTransactions_example1:
            description: ''
            summary: List transactions
            value: 200
        in: query
        name: pageSize
        schema:
          description: The maximum number of elements to return in a page. You can set this to a maximum of 500
            elements. If not specified, the default is 100.
          maximum: 500
          minimum: 1
          type: number
      - description: A token returned by a previous call to this operation in the `nextPageToken`. If not specified,
          Stedi returns the first page of results.
        in: query
        name: pageToken
        schema:
          description: A token returned by a previous call to this operation in the `nextPageToken`. If not specified,
            Stedi returns the first page of results.
          maxLength: 1024
          minLength: 1
          type: string
      - description: List only transactions containing a business identifier with the given value.
        in: query
        name: businessIdentifier
        schema:
          description: List only transactions containing a business identifier with the given value.
          type: string
      - description: 'List only a given type of transaction. Accepts any valid 3-digit X12 Transaction Set Identifier
          Code, as defined in the X12 standard. See: <https://www.stedi.com/edi/x12/element/143>.'
        in: query
        name: transactionSetId
        schema:
          $ref: '#/components/schemas/X12TransactionSetIdentifierCode'
      - description: List only transactions sent by the given profile. This is the profile ID of the sender.
        in: query
        name: sender
        schema:
          description: List only transactions sent by the given profile. This is the profile ID of the sender.
          type: string
      - description: List only transactions sent to the given profile. This is the profile ID of the receiver.
        in: query
        name: receiver
        schema:
          description: List only transactions sent to the given profile. This is the profile ID of the receiver.
          type: string
      - description: The direction of the transaction. Inbound transactions are those you receive from a payer,
          provider, or other trading partner. Outbound transactions are those you send to a payer, provider, or
          other trading partner.
        in: query
        name: direction
        schema:
          $ref: '#/components/schemas/Direction'
      - description: 'Indicates whether the transaction contains test or production data. Stedi determines this
          from the value in [`ISA15` Usage Indicator Code](https://www.stedi.com/edi/x12/segment/ISA#ISA-15). '
        in: query
        name: mode
        schema:
          $ref: '#/components/schemas/Mode'
      - description: A status indicating whether Stedi was able to successfully process the transaction.
        in: query
        name: status
        schema:
          $ref: '#/components/schemas/TransactionStatus'
      - description: The start of the time range to filter transactions. The results will include transactions created
          at or after this timestamp.
        in: query
        name: from
