          description: The start of the time range to filter transactions. The results will include transactions
            created at or after this timestamp.
          format: date-time
          type: string
      - description: The end of the time range to filter transactions. The results will include transactions up
          to and including this timestamp.
        in: query
        name: to
        schema:
          description: The end of the time range to filter transactions. The results will include transactions up
            to and including this timestamp.
          format: date-time
          type: string
      - description: List only transactions containing a business identifier with the given element ID. This is
          the X12 element ID, such as "127" for Reference Identification. May only be supplied if `businessIdentifier`
          is also supplied. See Stedi's EDI references pages to find element IDs.
        in: query
        name: elementId
        schema:
          description: List only transactions containing a business identifier with the given element ID. This is
            the X12 element ID, such as "127" for Reference Identification. May only be supplied if `businessIdentifier`
            is also supplied. See Stedi's EDI references pages to find element IDs.
          type: string
      - description: List only transactions that were sent or received on the given partnership. This is the partnership
          ID, such as "local_clearinghouse-test".
        in: query
        name: partnershipId
        schema:
          description: List only transactions that were sent or received on the given partnership. This is the partnership
            ID, such as "local_clearinghouse-test".
          type: string
