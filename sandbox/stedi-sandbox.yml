summary: >
  Stedi separates test from production by API KEY TYPE and an account-level Test mode toggle,
  not by a separate host or path — every mock request goes to the same production base URL
  (https://healthcare.us.stedi.com/2024-04-01/...) with a Test key. Test mode returns canned
  payer responses only: Stedi publishes a fixed set of mock request bodies and states that
  "you must use the exact values in the test request. Other birth dates, first names, last
  names, member IDs, and Social Security Numbers return errors." There is no custom mock data
  and no payer selection beyond the published fixtures. Mock eligibility checks are free.
modes:
- name: test
  selector: Test-type API key + account Test mode toggle
  key_creation: >
    Portal > account name in side navigation > API Keys > Generate new API Key, then choose
    Test as the key type. Stedi's docs suggest naming the key with a `test` prefix.
  enable: >
    Production accounts toggle Test mode ON from the account menu at any time. Sandbox accounts
    are limited to test mode until they upgrade.
  billing: Mock real-time eligibility checks are free.
- name: production
  selector: Production-type API key with Test mode OFF
  note: Production API keys inherit the permissions of the account member who created them.
hosts:
  separate_test_host: false
  note: Test and production share the same base URLs. Only the key type changes.
supported_in_test:
- Mock real-time eligibility checks (270/271), JSON and Raw X12
- MBI (Medicare Beneficiary Identifier) lookups against the CMS mock payer
- Test claims through the API or SFTP (production accounts only)
- MCP server (production accounts only; sandbox accounts must upgrade first)
- Stedi portal UI exploration
not_supported_in_test:
- Transaction enrollment
- Insurance discovery checks
- Coordination of benefits (COB) checks
- Submitting claims through the Stedi portal UI
- 275 claim attachments
- 276/277 real-time claim status
- Custom mock data or arbitrary payer selection
