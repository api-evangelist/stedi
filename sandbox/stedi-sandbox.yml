strictness:
  exact_match_required: true
  quote: >
    "You must use the exact values in the test request. Other birth dates, first names, last
    names, member IDs, and Social Security Numbers return errors."
time_simulation:
  supported: false
  note: No test clock or time-travel facility is documented.
trigger_tooling:
  webhooks:
    supported: true
    mechanism: >
      Event destinations can be tested with a `event.ping` validation event, and events can be
      re-delivered with the RetryEvent operation (POST /events/{eventId}/retry).
    docs: https://www.stedi.com/docs/healthcare/event-destinations-configure
  cli: false
  cli_note: Stedi publishes no CLI with fixture/trigger commands.
