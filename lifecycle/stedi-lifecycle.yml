sla:
  published: false
  note: >
    Stedi publishes no public uptime target or SLA document. The pricing page's Custom tier
    mentions a dedicated technical account manager but names no availability commitment. The
    API reference tells customers to contact support in Slack or Teams to raise concurrency
    limits, which is the closest thing to a negotiated service term on the public surface.
